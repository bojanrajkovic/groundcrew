name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    strategy:
      fail-fast: false
      matrix:
        # macos is a real target, not a formality: it exercises the psutil
        # code path that Linux development never touches.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src tests
      - run: uv run pytest
